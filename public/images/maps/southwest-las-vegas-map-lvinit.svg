<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1045.2 976.8" width="1045.2" height="976.8" role="img" aria-labelledby="mapTitle mapDesc">
<title id="mapTitle">Southwest Las Vegas -- an LVINIT area map</title>
<desc id="mapDesc">Schematic map of the southwest Las Vegas Valley. A dashed outline marks the area locals generally mean by Southwest Las Vegas, with a lighter dotted outline for the edges people disagree about. Mountain&apos;s Edge, Rhodes Ranch, Nevada Trails, Southern Highlands, the UnCommons and Durango Resort corridor and Desert Flow Bike Park are marked, along with the CC-215 Beltway, I-15, Blue Diamond Road, Durango Drive, Fort Apache Road, Rainbow Boulevard, the Las Vegas Strip, Harry Reid International Airport, Downtown Summerlin and the direction of Henderson. The Clark County towns of Enterprise and Spring Valley are labeled; their legal boundaries are not drawn.</desc>
