# ---------------------------------------------------------------------------
# LVINIT GSC Opportunity Agent — weekly run
#
# Two jobs.
#
# `report` — the analysis. Allowed to:
#   * authenticate to Google Search Console with a read-only service account
#   * fetch Search Console data
#   * run the opportunity analysis
#   * upload the full report as a workflow artifact (raw queries included —
#     unchanged, for Mikey and for debugging)
#   * print a short summary on the run page
# It is NOT allowed to commit or push (contents: read — the token cannot write
# to the repo), modify any site file, publish, deploy, open PRs or issues, or
# send email.
#
# `publish-state` — the Content Publisher handoff. It never sees a Search
# Console credential. It downloads THIS run's artifact, builds the SANITIZED
# reports/gsc/publisher-input.json (no raw query strings — the branch is
# public; see docs/PUBLISHER_HANDOFF.md), and commits that one namespace to
# lvinit-agent-state through the shared agent-state action, which refuses
# main and anything outside reports/gsc/. It is the only job with
# contents: write, and the token is handed only to the action's steps.
# Fixture runs build and validate the file but never commit it.
# ---------------------------------------------------------------------------

name: GSC Opportunity Agent

on:
  schedule:
    # 13:00 UTC every Monday — about 06:00 Las Vegas time (PDT), so a fresh
    # report is waiting at the start of the week. Cron is always UTC.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      period_days:
        description: "Length of the current window, in complete days"
        required: false
        default: "28"
      lag_days:
        description: "Search Console reporting-lag buffer, in days"
        required: false
        default: "3"
      min_score:
        description: "Minimum opportunity score to report (0-100)"
        required: false
        default: "40"
      fixtures:
        description: "Run against synthetic fixture data instead of live Search Console"
        required: false
        type: boolean
        default: false

# Read-only by default. This is what stops the analysis job from ever writing
# to the repository. Only publish-state raises it, for itself alone.
permissions:
  contents: read

concurrency:
  group: gsc-opportunity-agent
  cancel-in-progress: false

jobs:
  report:
    name: Analyze Search Console and publish a report artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No install step: the agent has zero runtime dependencies. It uses only
      # Node built-ins (node:crypto, fetch) plus files in this repository.

      - name: Run the agent's own test suite
        run: npm run gsc:test

      - name: Generate the opportunity report
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          PERIOD_DAYS: ${{ inputs.period_days || '28' }}
          LAG_DAYS: ${{ inputs.lag_days || '3' }}
          MIN_SCORE: ${{ inputs.min_score || '40' }}
          USE_FIXTURES: ${{ inputs.fixtures }}
        run: |
          set -euo pipefail
          ARGS="--period-days=$PERIOD_DAYS --lag-days=$LAG_DAYS --min-score=$MIN_SCORE"
          if [ "${USE_FIXTURES:-false}" = "true" ]; then
            echo "Running against FIXTURE data — output is synthetic."
            ARGS="$ARGS --fixtures"
          fi
          node scripts/gsc/run.mjs $ARGS | tee run-output.txt

      - name: Write the summary onto the run page
        if: always()
        run: |
          {
            echo "## LVINIT GSC Opportunity Agent"
            echo
            echo '```'
            cat run-output.txt 2>/dev/null || echo "The run produced no output."
            echo '```'
            echo
            echo "The full Markdown and JSON reports are attached to this run as an artifact."
            echo "This job committed nothing. The publish-state job commits only the sanitized handoff (no raw queries) to lvinit-agent-state. Nothing was published or deployed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-opportunities
          path: reports/gsc/
          if-no-files-found: warn
          retention-days: 90

  publish-state:
    name: Publish the sanitized Publisher handoff to lvinit-agent-state
    needs: report
    if: needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one place this workflow can write: the agent-state action pushes only
    # to lvinit-agent-state, only under reports/gsc/, and refuses main.
    permissions:
      contents: write

    steps:
      - name: Check out main (no credentials left on disk)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download this run's GSC report
        uses: actions/download-artifact@v4
        with:
          name: gsc-opportunities
          path: gsc-artifact

      - name: Check out lvinit-agent-state
        uses: ./.github/actions/agent-state
        with:
          mode: checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the handoff contract tests
        run: node --test "scripts/publisher-inputs/test/*.test.mjs"

      - name: Build the sanitized Publisher input
        # No token in this step's environment. Fails closed: if a raw query
        # would reach the public file, the builder exits 1 and nothing is
        # committed — the previous handoff simply ages.
        run: |
          set -euo pipefail
          node scripts/gsc/publisher-input.mjs             --report-dir=gsc-artifact             --out=.agent-state/reports/gsc/publisher-input.json | tee handoff-output.txt

      - name: Commit reports/gsc/publisher-input.json to lvinit-agent-state
        if: inputs.fixtures != true
        uses: ./.github/actions/agent-state
        with:
          mode: commit
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: reports/gsc
          message: "gsc: publisher input (run ${{ github.run_number }})"

      - name: Write the handoff summary onto the run page
        if: always()
        env:
          REPO: ${{ github.repository }}
          FIXTURES: ${{ inputs.fixtures }}
        run: |
          {
            echo "## Publisher handoff"
            echo
            echo '```'
            cat handoff-output.txt 2>/dev/null || echo "The handoff was not built — see the log above."
            echo '```'
            echo
            if [ "${FIXTURES:-false}" = "true" ]; then
              echo "Fixture run: the handoff was built and validated but NOT committed."
            else
              echo "Sanitized (no raw queries): https://github.com/$REPO/blob/lvinit-agent-state/reports/gsc/publisher-input.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
