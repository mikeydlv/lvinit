# ---------------------------------------------------------------------------
# LVINIT Internal Linking Agent — weekly run
#
# This is the ONE LVINIT agent that is allowed to write to the repository, so
# what it may do is spelled out here and enforced by the permissions block and
# by the agent's own code, not by convention.
#
# What this job is allowed to do:
#   * read the repository's published editorial content
#   * build the internal link graph
#   * read (never write) the GSC, Fact-Decay and Content Brief agents' report
#     artifacts, and its own earlier reports
#   * add contextual internal links that meet every safety rule, by wrapping
#     words that are ALREADY on the page in a <Link>
#   * run TypeScript, ESLint and a production build against those edits
#   * commit and push those edits to main
#   * upload its report as a workflow artifact
#
# What it is NOT allowed to do, by construction:
#   * add, remove or reword one word of published copy (the agent's own copy
#     checksum refuses any edit that would, and the diff inspector refuses any
#     diff that is not purely an added <Link> wrapper)
#   * create or rewrite an article, change metadata, schema, imagery,
#     navigation, CTAs, lead forms or design
#   * touch anything outside app/ and lib/areas/
#   * force-push, rebase through a conflict, or push from a dirty or diverged
#     working tree
#   * modify the GSC, Fact-Decay or Content Brief agents' reports, scoring or
#     brief status
#
# `contents: write` is the minimum this job needs, and it is the ONLY elevated
# permission granted. There is no `pull-requests`, no `issues`, no `packages`,
# no `id-token`, no `deployments`. `actions: read` exists solely so the run can
# download the other agents' report artifacts and its own history.
#
# TO TURN OFF AUTONOMOUS PUSHING without deleting anything: set the repository
# variable LINKS_GIT_PUSH to "false". The job then edits, validates, reports,
# and leaves the changes uncommitted — see docs/INTERNAL_LINKING_AGENT.md.
#
# No secrets are used. This agent has no credentials beyond the run's own
# GITHUB_TOKEN.
# ---------------------------------------------------------------------------

name: Internal Linking Agent

on:
  schedule:
    # 13:00 UTC every Wednesday — about 06:00 Las Vegas time (PDT).
    #
    # The week is deliberately laid out so each agent reads a fresh copy of the
    # one before it and nothing lands on the same morning:
    #
    #   Monday     13:00  GSC Opportunity Agent    (search performance)
    #   Tuesday    13:00  Content Brief Generator  (reads Monday's GSC report)
    #   Wednesday  13:00  Internal Linking Agent   (this job — reads Monday's GSC
    #                                               report and Tuesday's briefs)
    #   Thursday   13:00  Fact-Decay Agent         (factual freshness)
    #
    # A full day after the Brief Generator, so its artifact is always there.
    # Wednesday also puts a day between this job's push and Thursday's
    # Fact-Decay scan, so that scan sees the linked site rather than racing it.
    # The Fact-Decay report this job reads is therefore the PREVIOUS Thursday's
    # (6 days old) — well inside the 45-day freshness limit.
    - cron: "0 13 * * 3"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually add the safe links (off = report only)"
        required: false
        type: boolean
        default: true
      max_links:
        description: "Maximum links added this run"
        required: false
        default: "8"
      max_pages:
        description: "Maximum pages modified this run"
        required: false
        default: "5"
      min_confidence:
        description: "Auto-execution confidence line, 0-1"
        required: false
        default: "0.72"
      push:
        description: "Push the commit (off = commit locally only, nothing ships)"
        required: false
        type: boolean
        default: true
      fixtures:
        description: "Run against the synthetic fixture site instead of the real content"
        required: false
        type: boolean
        default: false

permissions:
  # The only elevated permission, and the only one this agent needs: it commits
  # its own link edits to main.
  contents: write
  # Read-only, and solely to download the other agents' report artifacts and
  # this agent's own earlier reports.
  actions: read

concurrency:
  # Never two of these at once — a second run would find the first one's commit
  # and stop on a dirty or diverged tree, which is correct but wasteful.
  group: internal-linking-agent
  cancel-in-progress: false

jobs:
  link:
    name: Improve internal linking and publish a report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history: the agent reads git dates as one input to how new a
          # page is, and a shallow clone makes the push a non-fast-forward.
          fetch-depth: 0
          # Kept, deliberately — unlike the two read-only agents, this one has
          # to be able to push.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # Unlike the GSC and Fact-Decay agents, this one runs the repository's
        # own typecheck, lint and production build against its edits, so the
        # project's dependencies have to be present.
        run: npm ci

      - name: Run the agent's own test suite
        run: npm run links:test

      - name: Identify the committer
        run: |
          set -euo pipefail
          git config user.name "LVINIT Internal Linking Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch the newest GSC report, if there is one
        # Optional prioritization signal, read-only. Same approach as the
        # Fact-Decay Agent's job: walk several recent successful runs and let
        # the agent pick the newest REPORT by the date in its filename, because
        # `gh run list` is ordered by when a run was created, not by which run
        # produced the newest report.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p reports/gsc
          RUN_IDS="$(gh run list --workflow gsc-opportunity-agent.yml --status success \
            --limit 5 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          if [ -z "${RUN_IDS:-}" ]; then
            echo "No successful GSC Opportunity Agent run found. Continuing with no traffic weighting."
            exit 0
          fi
          for RUN_ID in $RUN_IDS; do
            if gh run download "$RUN_ID" --name gsc-opportunities --dir "reports/gsc/run-$RUN_ID" 2>/dev/null; then
              echo "Downloaded the gsc-opportunities artifact from run $RUN_ID."
            fi
          done
          FOUND="$(find reports/gsc -maxdepth 2 -name 'gsc-opportunities-*.json' -printf '%f\t%p\n' \
            | sort | tail -n 1 | cut -f2)"
          if [ -n "$FOUND" ]; then
            echo "GSC report available for prioritization: $FOUND"
          else
            echo "No GSC report was downloaded. Continuing with no traffic weighting."
          fi

      - name: Fetch the newest Fact-Decay report, if there is one
        # Optional destination-eligibility signal, read-only. A page with a
        # serious unresolved factual problem does not get more readers pushed
        # into it. If this step finds nothing, the agent still runs and the
        # report says the check could not be made.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p reports/fact-decay
          RUN_IDS="$(gh run list --workflow fact-decay-agent.yml --status success \
            --limit 5 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          if [ -z "${RUN_IDS:-}" ]; then
            echo "No successful Fact-Decay Agent run found. Destination freshness will not be checked."
            exit 0
          fi
          for RUN_ID in $RUN_IDS; do
            if gh run download "$RUN_ID" --name fact-decay-report --dir "reports/fact-decay/run-$RUN_ID" 2>/dev/null; then
              echo "Downloaded the fact-decay-report artifact from run $RUN_ID."
            fi
          done
          FOUND="$(find reports/fact-decay -maxdepth 2 -name 'fact-decay-*.json' -printf '%f\t%p\n' \
            | sort | tail -n 1 | cut -f2)"
          if [ -n "$FOUND" ]; then
            echo "Fact-Decay report available for destination checks: $FOUND"
          else
            echo "No Fact-Decay report was downloaded. Destination freshness will not be checked."
          fi

      - name: Fetch the newest Content Brief report, if there is one
        # Optional cluster context, read-only. It can reorder safe links and it
        # keeps this job off a page with a LIVE Publisher handoff queued; it can
        # never create a link or change a confidence score. The artifact's own
        # fixtures/ folder lands two levels deep and is never picked up.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p reports/content-briefs
          RUN_IDS="$(gh run list --workflow content-brief-generator.yml --status success \
            --limit 5 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          for RUN_ID in $RUN_IDS; do
            gh run download "$RUN_ID" --name content-briefs --dir "reports/content-briefs/run-$RUN_ID" 2>/dev/null \
              && echo "Downloaded content-briefs from run $RUN_ID."
          done
          FOUND="$(find reports/content-briefs -maxdepth 2 -name 'content-opportunities-*.json' -printf '%f\t%p\n' \
            | sort | tail -n 1 | cut -f2)"
          echo "Content Brief report for context: ${FOUND:-none}"

      - name: Fetch this agent's earlier reports (week-to-week identity)
        # Downloaded into reports/internal-links-history/, NEVER into the output
        # directory — otherwise every artifact would contain every earlier one
        # (the Content Brief Generator's convention). History is what keeps
        # LINK ids stable, stops an unchanged review item being written up every
        # week, and stops the agent re-adding a link a person removed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p reports/internal-links-history
          RUN_IDS="$(gh run list --workflow internal-linking-agent.yml --status success \
            --limit 12 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          for RUN_ID in $RUN_IDS; do
            gh run download "$RUN_ID" --name internal-links-report --dir "reports/internal-links-history/run-$RUN_ID" 2>/dev/null \
              && echo "Downloaded earlier internal-links-report from run $RUN_ID."
          done

      - name: Confirm the working tree is clean before editing
        # The downloaded reports live in gitignored directories, so they must
        # not show up here. If anything else does, the agent would stop on its
        # own preflight — this makes the reason visible in the log first.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::The working tree is not clean. The agent will refuse to edit."
            git status --porcelain
          else
            echo "Working tree is clean."
          fi

      - name: Improve internal linking
        env:
          APPLY: ${{ inputs.apply == null && 'true' || inputs.apply }}
          MAX_LINKS: ${{ inputs.max_links || '8' }}
          MAX_PAGES: ${{ inputs.max_pages || '5' }}
          MIN_CONFIDENCE: ${{ inputs.min_confidence || '0.72' }}
          USE_FIXTURES: ${{ inputs.fixtures }}
          # The kill switch. Set the repository variable LINKS_GIT_PUSH to
          # "false" to stop this job pushing, without editing this file.
          LINKS_GIT_PUSH: ${{ vars.LINKS_GIT_PUSH || 'true' }}
          PUSH_INPUT: ${{ inputs.push == null && 'true' || inputs.push }}
        run: |
          set -euo pipefail
          ARGS="--max-links=$MAX_LINKS --max-pages=$MAX_PAGES --min-confidence=$MIN_CONFIDENCE"
          if [ "${USE_FIXTURES:-false}" = "true" ]; then
            echo "Running against the FIXTURE site — output is synthetic and nothing will be edited."
            ARGS="$ARGS --fixtures"
          elif [ "${APPLY:-true}" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          if [ "${PUSH_INPUT:-true}" != "true" ]; then
            ARGS="$ARGS --no-push"
          fi
          # The console copy goes to $RUNNER_TEMP, OUTSIDE the checkout. `tee`
          # starts alongside the agent and creates its file immediately, so a
          # file in the repository would already exist, untracked, when the
          # agent's clean-tree preflight runs — and the agent would (correctly)
          # refuse to edit. The preflight itself is unchanged.
          node scripts/internal-links/run.mjs $ARGS | tee "$RUNNER_TEMP/internal-links-run-output.txt"

      - name: Write the summary onto the run page
        if: always()
        run: |
          {
            echo "## LVINIT Internal Linking Agent"
            echo
            echo '```'
            cat "$RUNNER_TEMP/internal-links-run-output.txt" 2>/dev/null || echo "The run produced no output."
            echo '```'
            echo
            echo "Only contextual internal links were changed, and only by wrapping words that were"
            echo "already on the page. No article was written or rewritten, no published copy was"
            echo "altered, and no metadata, schema, imagery, navigation or CTA was touched."
            echo
            echo "The full Markdown and JSON reports are attached to this run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show what shipped
        if: always()
        run: |
          set -uo pipefail
          echo "HEAD is now: $(git rev-parse --short HEAD)"
          git log --oneline -3
          echo "Working tree state:"
          git status --porcelain || true

      - name: Upload the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-links-report
          path: reports/internal-links/
          if-no-files-found: warn
          retention-days: 90
